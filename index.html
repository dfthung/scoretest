        if (!config) {
          host.replaceChildren();
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.className = "scoreaxis-widget";
        wrapper.id = config.id;
        wrapper.style.width = "auto";
        wrapper.style.height = "auto";
        wrapper.style.fontSize = "14px";
        wrapper.style.backgroundColor = "#ffffff";
        wrapper.style.color = "#141416";
        wrapper.style.border = "1px solid";
        wrapper.style.borderColor = "#ecf1f7";
        wrapper.style.overflow = "auto";

        const script = document.createElement("script");
        script.src = config.src;
        script.async = true;

        const credit = document.createElement("div");
        credit.className = "widget-main-link";
        credit.style.padding = "6px 12px";
        credit.style.fontWeight = "500";
        credit.innerHTML = 'Live data by <a href="https://www.scoreaxis.com/" style="color: inherit;">Scoreaxis</a>';

        wrapper.appendChild(credit);
        host.replaceChildren(wrapper);
